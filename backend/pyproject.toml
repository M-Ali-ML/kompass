[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.17.0",
    "langfuse>=4.14.4",
    "mcp>=1.28.1",
    "pydantic-ai>=2.28.0",
    "pydantic-evals>=2.5.0",
    "sqlalchemy>=2.0.52",
    "python-dotenv>=1.0.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "ag-ui-protocol>=0.1.13",
    "pydantic-settings>=2.15.0",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.5",
    "httpx>=0.27.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# Put the backend root on sys.path so tests can `import app...` when invoked as
# bare `pytest` (not just `python -m pytest`, which adds the CWD implicitly).
pythonpath = ["."]
testpaths = ["tests"]
